name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm infra:up
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://reconcile:local-demo-password@localhost:5432/reconcile
      - name: Identity integration tests (real PostgreSQL)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://reconcile:local-demo-password@localhost:5432/reconcile
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: reconcile-demo
          S3_ACCESS_KEY_ID: reconcile-local
          S3_SECRET_ACCESS_KEY: local-demo-storage-password
      - name: Smoke API and worker
        run: |
          set -euo pipefail
          cp .env.example .env
          node --env-file=.env apps/api/dist/main.js > /tmp/api.log 2>&1 &
          API_PID=$!
          node --env-file=.env apps/worker/dist/main.js > /tmp/worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$API_PID" "$WORKER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready; then break; fi
            sleep 1
          done
          pnpm --filter @reconcile/worker smoke
      - name: Expert routing and evidence gate
        run: pnpm harness:gate
        env:
          HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Diagnostics
        if: failure()
        run: |
          cat /tmp/api.log /tmp/worker.log 2>/dev/null || true
          docker compose -f infra/docker/compose.yaml logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:packages && pnpm --filter @reconcile/web build
      - name: Agreement browser acceptance (synthetic API fixtures)
        run: |
          set -euo pipefail
          pnpm --filter @reconcile/web exec vite preview --host 127.0.0.1 --port 5173 > /tmp/browser-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then break; fi
            sleep 1
          done
          node apps/web/test/agreements.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agreement-browser-evidence
          path: /tmp/agreements-qa-*.png
          if-no-files-found: ignore
      - name: Browser diagnostics
        if: failure()
        run: cat /tmp/browser-web.log

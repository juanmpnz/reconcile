# Docker embedded DNS: refresh API addresses after an API-only recreation.
resolver 127.0.0.11 valid=5s ipv6=off;
# Preserve stricter upstream policies, notably sandboxed document attachments.
map $upstream_http_content_security_policy $reconcile_csp {
  default $upstream_http_content_security_policy;
  "" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
}
upstream reconcile_api {
  zone reconcile_api 64k;
  server api:3000 resolve;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy $reconcile_csp always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location ^~ /api/v1/health/ { return 404; }
  location /api/ {
    client_max_body_size 11m;
    proxy_pass http://reconcile_api;
    proxy_hide_header Content-Security-Policy;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; }
}

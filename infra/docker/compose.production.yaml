# Coolify Git Compose: configure only web's domain on container port 8080.
# No host ports. Generated values must remain stable across redeployments.
x-service-environment: &service-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  DATABASE_URL: postgresql://reconcile:${SERVICE_PASSWORD_64_POSTGRES:?Required generated PostgreSQL password}@postgres:5432/reconcile?connect_timeout=5&pool_timeout=5
  REDIS_URL: redis://:${SERVICE_PASSWORD_64_REDIS:?Required generated Redis password}@redis:6379
  S3_ENDPOINT: http://storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: reconcile-documents
  S3_ACCESS_KEY_ID: ${SERVICE_USER_STORAGE:?Required generated storage user}
  S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_STORAGE:?Required generated storage password}
  WORKER_CONCURRENCY: '2'
services:
  postgres:
    mem_limit: 512m
    cpus: '1.0'
    pids_limit: 128
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_DB: reconcile
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?Required generated PostgreSQL password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U reconcile -d reconcile']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  redis:
    user: redis
    mem_limit: 256m
    cpus: '0.5'
    pids_limit: 64
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS:?Required generated Redis password}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"',
      ]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  storage:
    mem_limit: 1g
    cpus: '1.0'
    pids_limit: 256
    image: chrislusf/seaweedfs:4.48
    command: [mini, '-dir=/data', '-s3.port=9000']
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_STORAGE:?Required generated storage user}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_STORAGE:?Required generated storage password}
      S3_BUCKET: reconcile-documents
    volumes: [storage-data:/data]
    networks: [data]
    healthcheck:
      test:
        [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 40
    logging: *logging
  api:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: '1.0'
    pids_limit: 128
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    command:
      [
        sh,
        -c,
        'node packages/database/node_modules/prisma/build/index.js migrate deploy --schema packages/database/prisma/schema.prisma && exec node apps/api/dist/main.js',
      ]
    environment:
      <<: *service-environment
      AUTH_BASE_URL: ${APP_URL:?Required public HTTPS origin}
      WEB_ORIGIN: ${APP_URL:?Required public HTTPS origin}
      AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH:?Required generated authentication secret}
      MAIL_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:?Required authenticated SMTP host}
      SMTP_PORT: '587'
      SMTP_SECURE: 'false'
      SMTP_USER: ${SMTP_USER:?Required SMTP user}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Required SMTP password}
      MAIL_FROM: ${MAIL_FROM:?Required verified sender address}
    networks: [default, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    logging: *logging
  worker:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: '1.0'
    pids_limit: 128
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *service-environment
    networks: [data]
    depends_on:
      api: { condition: service_healthy }
    logging: *logging
  web:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: '0.5'
    pids_limit: 64
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    restart: unless-stopped
    expose: ['8080']
    networks: [default]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
networks:
  default: {}
  data: { internal: true }
volumes:
  postgres-data:
  redis-data:
  storage-data:

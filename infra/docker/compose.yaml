name: reconcile-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: reconcile
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reconcile -d reconcile']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ['mini', '-dir=/data', '-s3.port=9000']
    environment:
      AWS_ACCESS_KEY_ID: reconcile-local
      AWS_SECRET_ACCESS_KEY: local-demo-storage-password
      S3_BUCKET: reconcile-demo
    ports: ['127.0.0.1:9000:9000']
    volumes: ['storage-data:/data']
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9333/cluster/status',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:
  storage-data:
